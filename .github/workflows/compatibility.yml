name: QGIS compatibility

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv and select tooling Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.8.4'
          python-version: '3.13'
      - name: Install locked development tools
        run: uv sync --locked
      - name: Lint Python
        run: uv run --locked ruff check --output-format=github .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .

  test:
    name: QGIS ${{ matrix.qgis }} / Qt ${{ matrix.qt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - qgis: '3.40'
            qt: 5
            image: qgis/qgis:3.40-bookworm@sha256:96ae9dab2e81d05b5d08913b789525db6d203a009d66ca1aff437da73d5f4eb2
          - qgis: '3.44'
            qt: 5
            image: qgis/qgis:3.44-bookworm@sha256:90844fef63a85763f8817c23cc21994c8822de7a31238df0e35260620be882c0
          - qgis: '4.0'
            qt: 6
            image: qgis/qgis:4.0-trixie@sha256:23c12670e69909e8659a5c098aa307996735a5763b9ff9c3268bdeeee1a10916
    container:
      image: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Package the plugin
        run: python3 scripts/package-plugin.py --output /tmp/raster-scribe.zip
      - name: Test the installable ZIP
        run: >-
          python3 scripts/run-tests.py
          --plugin-zip /tmp/raster-scribe.zip
          --expected-qgis '${{ matrix.qgis }}'
          --expected-qt-major '${{ matrix.qt }}'
